name: Test

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'test/**'
      - 'ci/**'
      - 'chore/**'
      - 'refactor/**'
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: flake8
        run: flake8 scripts/ tests/
      - name: mypy
        run: mypy scripts/ --ignore-missing-imports
      - name: pip-audit (current environment)
        continue-on-error: true
        run: pip-audit --desc

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=scripts --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=90
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml

  ros2-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy, kilted, lyrical, rolling]
    steps:
      - uses: actions/checkout@v6
      - name: Verify Docker image exists
        run: docker pull osrf/ros:${{ matrix.ros_distro }}-desktop
      - name: Build and test in ROS 2 ${{ matrix.ros_distro }}
        run: |
          docker build \
            -f tests/Dockerfile.ros2-test \
            --build-arg ROS_DISTRO=${{ matrix.ros_distro }} \
            --progress=plain \
            -t ros2-test:${{ matrix.ros_distro }} \
            .

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            references/*.md
            SKILL.md
            README.md

  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check scripts syntax
        run: |
          python -m py_compile scripts/*.py
          bash -n install.sh
      - name: Verify user-facing versions
        run: |
          python scripts/create_package.py --version
          python scripts/qos_checker.py --version
          python scripts/launch_validator.py --version
      - name: Validate plugin JSON
        run: |
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
          python -m json.tool hooks/hooks.json > /dev/null
      - name: Run launch validator on generated packages
        run: |
          mkdir -p /tmp/test_pkgs
          python scripts/create_package.py test_cpp --type cpp --dest /tmp/test_pkgs
          python scripts/create_package.py test_py --type python --dest /tmp/test_pkgs
          python scripts/launch_validator.py /tmp/test_pkgs/
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate skill and plugin packaging
        run: |
          python -m pytest \
            tests/test_skills2_frontmatter.py \
            tests/test_repo_conventions.py \
            tests/test_installers.py -q
      - name: Run eval fixture smoke check
        run: python scripts/eval_runner.py
